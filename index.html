<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ponto</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #relogio { font-size: 2.5em; font-weight: bold; text-align: center; margin-bottom: 20px; color: #333; }
        .funcionarios { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-func { padding: 10px 15px; font-size: 16px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
        .btn-func.ativo { background: #2196F3; color: white; border-color: #2196F3; }
        .botoes-ponto { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-ponto { padding: 12px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; }
        #btn-in { background-color: #4CAF50; }
        #btn-out { background-color: #f44336; }
        #btn-in:disabled, #btn-out:disabled { background-color: #ccc; cursor: not-allowed; }
        #status-msg { margin-bottom: 15px; font-weight: bold; color: #555; }
        #log-ponto { background: #f4f4f4; padding: 15px; border-radius: 5px; min-height: 100px; max-height: 400px; overflow-y: auto; }
        .registro-item { border-bottom: 1px solid #ddd; padding: 8px 0; }
        
        .area-relatorio { margin-top: 20px; display: flex; gap: 10px; }
        select { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; flex: 1; }
        .btn-relatorio { background-color: #673AB7; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #painel-relatorio { background: #e3f2fd; padding: 15px; border-radius: 5px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <h1>Controle de Ponto</h1>
    <div id="relogio">00:00:00</div>
    
    <h3>Selecione o Funcionário:</h3>
    <div class="funcionarios" id="lista-funcionarios"></div>
    <div id="status-msg">Nenhum funcionário selecionado</div>

    <div class="botoes-ponto">
        <button class="btn-ponto" id="btn-in" onclick="registrarPonto('in')" disabled>Clock In</button>
        <button class="btn-ponto" id="btn-out" onclick="registrarPonto('out')" disabled>Clock Out</button>
    </div>

    <h2>Histórico de Registros (Nuvem)</h2>
    <div id="log-ponto">Carregando dados...</div>

    <div class="area-relatorio">
        <select id="filtro-tempo">
            <option value="6_meses">Últimos 6 Meses (Geral)</option>
            <option value="mensal">Mês Atual (Desde o dia 1)</option>
            <option value="quinzenal">Últimos 14 dias (Bi-semanal)</option>
            <option value="semanal">Últimos 7 dias (Semanal)</option>
        </select>
        <button class="btn-relatorio" onclick="gerarRelatorio()">Calcular</button>
    </div>
    
    <div id="painel-relatorio"></div>

    <script>
        const nomes = ['Pedro', 'Max', 'Carlos', 'Sanny'];
        let usuarioSelecionado = null;
        let registros = [];
        
        let estadoUsuarios = JSON.parse(localStorage.getItem('estadoUsuarios')) || {};
        nomes.forEach(nome => {
            if (!estadoUsuarios[nome]) estadoUsuarios[nome] = { trabalhando: false, horaEntrada: null };
        });

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
        }

        function selecionar(nome) {
            usuarioSelecionado = nome;
            renderizarTela();
            atualizarContador();
        }

        async function carregarRegistros() {
            try {
                const resposta = await fetch('/api/ponto');
                registros = await resposta.json();
                renderizarTela();
            } catch (erro) {
                document.getElementById('log-ponto').innerText = "Erro ao carregar os registros.";
            }
        }

        async function registrarPonto(tipo) {
            if (!usuarioSelecionado) return;

            const estado = estadoUsuarios[usuarioSelecionado];
            const agora = new Date();
            let eventoTexto = '';
            let resumoTexto = '';

            if (tipo === 'in') {
                estado.trabalhando = true;
                estado.horaEntrada = agora.toISOString();
                eventoTexto = 'Clock In';
            } else if (tipo === 'out') {
                const entrada = new Date(estado.horaEntrada);
                const minutosTotais = Math.floor((agora - entrada) / 60000);
                const horas = Math.floor(minutosTotais / 60);
                const minutos = minutosTotais % 60;

                estado.trabalhando = false;
                estado.horaEntrada = null;
                eventoTexto = 'Clock Out';
                resumoTexto = `(Duração: ${horas}h ${minutos}m)`;
            }

            localStorage.setItem('estadoUsuarios', JSON.stringify(estadoUsuarios));
            renderizarTela();

            const dadosParaSalvar = {
                nome: usuarioSelecionado,
                evento: eventoTexto,
                hora_local: agora.toLocaleTimeString('pt-BR'),
                data_completa: agora.toISOString(),
                resumo: resumoTexto
            };

            try {
                await fetch('/api/ponto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosParaSalvar)
                });
                await carregarRegistros();
            } catch (erro) {
                alert("Erro ao salvar no banco de dados.");
            }
        }

        function renderizarTela() {
            const divFunc = document.getElementById('lista-funcionarios');
            divFunc.innerHTML = '';
            nomes.forEach(nome => {
                const btn = document.createElement('button');
                btn.className = `btn-func ${usuarioSelecionado === nome ? 'ativo' : ''}`;
                btn.innerText = nome;
                btn.onclick = () => selecionar(nome);
                divFunc.appendChild(btn);
            });

            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');
            const statusMsg = document.getElementById('status-msg');

            if (usuarioSelecionado) {
                const estado = estadoUsuarios[usuarioSelecionado];
                if (estado.trabalhando) {
                    statusMsg.innerText = `Status: ${usuarioSelecionado} está em turno.`;
                    btnIn.disabled = true;
                    btnOut.disabled = false;
                } else {
                    statusMsg.innerText = `Status: ${usuarioSelecionado} fora do turno.`;
                    btnIn.disabled = false;
                    btnOut.disabled = true;
                    btnOut.innerText = 'Clock Out'; 
                }
            } else {
                statusMsg.innerText = 'Nenhum funcionário selecionado';
                btnIn.disabled = true;
                btnOut.disabled = true;
                btnOut.innerText = 'Clock Out';
            }

            const divLog = document.getElementById('log-ponto');
            divLog.innerHTML = '';
            registros.forEach(reg => {
                divLog.innerHTML += `<div class="registro-item">
                    <strong>${reg.nome}</strong> | ${reg.evento} às ${reg.hora_local} ${reg.resumo || ''}
                </div>`;
            });
        }

        function atualizarContador() {
            if (usuarioSelecionado) {
                const estado = estadoUsuarios[usuarioSelecionado];
                if (estado.trabalhando && estado.horaEntrada) {
                    const agora = new Date();
                    const entrada = new Date(estado.horaEntrada);
                    const minutosTotais = Math.floor((agora - entrada) / 60000);
                    const horas = Math.floor(minutosTotais / 60);
                    const minutos = minutosTotais % 60;
                    document.getElementById('btn-out').innerText = `Clock Out (${horas}h ${minutos}m)`;
                }
            }
        }

        function gerarRelatorio() {
            const periodo = document.getElementById('filtro-tempo').value;
            const painel = document.getElementById('painel-relatorio');
            painel.style.display = 'block';
            
            let titulo = '';
            const agora = new Date();
            let dataLimite = new Date();

            // Configura a data limite com base na seleção
            if (periodo === 'semanal') {
                dataLimite.setDate(agora.getDate() - 7);
                titulo = 'Últimos 7 dias';
            } else if (periodo === 'quinzenal') {
                dataLimite.setDate(agora.getDate() - 14);
                titulo = 'Últimos 14 dias';
            } else if (periodo === 'mensal') {
                dataLimite.setDate(1); // Volta para o dia 1 do mês atual
                dataLimite.setHours(0, 0, 0, 0);
                titulo = 'Mês Atual';
            } else {
                dataLimite.setMonth(agora.getMonth() - 6);
                titulo = 'Últimos 6 meses';
            }

            painel.innerHTML = `<h3>Horas Trabalhadas - ${titulo}</h3>`;

            const totais = {};
            nomes.forEach(nome => totais[nome] = 0); 
            const entradasPendentes = {}; 

            // Filtra os dados carregados usando a data limite e inverte para ordem cronológica
            const registrosFiltrados = registros.filter(reg => new Date(reg.data_completa) >= dataLimite);
            const cronologico = [...registrosFiltrados].reverse();

            cronologico.forEach(reg => {
                if (reg.evento === 'Clock In') {
                    entradasPendentes[reg.nome] = new Date(reg.data_completa);
                } else if (reg.evento === 'Clock Out' && entradasPendentes[reg.nome]) {
                    const saida = new Date(reg.data_completa);
                    const entrada = entradasPendentes[reg.nome];
                    
                    const minutos = Math.floor((saida - entrada) / 60000);
                    totais[reg.nome] += minutos;
                    
                    entradasPendentes[reg.nome] = null;
                }
            });

            nomes.forEach(nome => {
                const horas = Math.floor(totais[nome] / 60);
                const minutos = totais[nome] % 60;
                painel.innerHTML += `<p><strong>${nome}:</strong> ${horas}h ${minutos}m</p>`;
            });
        }

        atualizarRelogio();
        carregarRegistros();
        
        setInterval(() => {
            atualizarRelogio();
            atualizarContador();
        }, 1000);

    </script>
</body>
</html>
